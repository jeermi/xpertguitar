name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests unitaires
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Compiler l'APK
        env:
          XPERT_KEYSTORE_B64: ${{ secrets.XPERT_KEYSTORE_B64 }}
          XPERT_KEYSTORE_PASSWORD: ${{ secrets.XPERT_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$XPERT_KEYSTORE_B64" ]; then
            echo "$XPERT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/xpert.jks"
            export XPERT_KEYSTORE="$RUNNER_TEMP/xpert.jks"
          fi
          ./gradlew --no-daemon assembleRelease
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk xpert-guitare.apk
      - uses: actions/upload-artifact@v4
        with:
          name: xpert-guitare-apk
          path: xpert-guitare.apk
      - name: Publier l'APK (dernière version sur main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: XPert Guitare (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            APK à installer à la main : télécharge **xpert-guitare.apk** depuis le téléphone, puis ouvre-le.
            Commit : ${{ github.sha }}
          files: xpert-guitare.apk
